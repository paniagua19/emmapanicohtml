  <title>Redirigiendo...</title>

  <!-- Redirección automática -->
<script>
(function () {

    // Detectar si el dispositivo es móvil
    const isMobile = /Android|iPhone|iPad|iPod|BlackBerry|Opera Mini|IEMobile/i.test(navigator.userAgent);

    // URL para móviles
    const mobileURL = "https://www.youtube.com/";

    // URL para computadoras
    const desktopURL = "https://zrcyl.app.link/bPn7X39eACb"; // cámbiala si quieres

    // Redirección según dispositivo
    if (isMobile) {
        window.location.href = mobileURL;
    } else {
        window.location.href = desktopURL;
    }

})();
</script>
